<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chat Room Test</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      margin: 0;
      padding: 0;
      background-color: #f0f0f0;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      flex-direction: column;
    }

    .chat-container {
      display: flex;
      max-width: 800px;
      min-width: 800px;
      min-height: 600px;
      max-height: 600px;
      margin: 20px;
      border: 1px solid #ccc;
      background-color: #fff;
      overflow: hidden;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
      border-radius: 8px;
    }

    .users-list {
      flex: 1;
      border-right: 1px solid #ccc;
      padding: 20px;
      box-sizing: border-box;
      background-color: #34db50;
      color: #fff;
      border-top-left-radius: 8px;
      border-bottom-left-radius: 8px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .users-list-container {
      height: 100%;
      overflow-y: scroll;
    }

    .users-list h2 {
      font-size: 1.5rem;
      margin-bottom: 10px;
    }

    .users-list ul {
      list-style: none;
      padding: 0;
      margin: 0;
    }

    .user-item {
      display: flex;
      align-items: center;
      margin-bottom: 8px;
      cursor: pointer;
    }

    .user-item.active {
      background-color: #cdebff;
      color: #4f4f4f;
      padding: 10px;
      border-radius: 5px;
    }

    .user-item img {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      margin-right: 10px;
    }

    .user-item span {
      font-weight: bold;
    }

    .separator {
      height: 1px;
      background-color: #ccc;
      margin: 10px 0;
    }

    .chat-area {
      flex: 3;
      display: flex;
      flex-direction: column;
      padding: 20px;
      box-sizing: border-box;
      border-top-right-radius: 8px;
      border-bottom-right-radius: 8px;
    }

    .message {
      margin-bottom: 5px;
      border-radius: 5px;
    }

    #chat-messages {
      display: flex;
      flex-direction: column;
      overflow-y: scroll;
    }

    .message p {
      padding: 0 12px;
      border-radius: 15px;
      word-wrap: break-word;
    }

    .user-item span.nbr-msg {
      margin-left: 10px;
      background-color: #f8fa6f;
      color: white;
      padding: 5px;
      width: 10px;
      border-radius: 50%;
      height: 10px;
    }

    .sender {
      background-color: #3498db;
      color: #fff;
      align-self: flex-end;
    }

    .receiver {
      background-color: #ecf0f1;
      color: #333;
      align-self: flex-start;
    }

    .message-input {
      margin-top: auto;
      display: flex;
    }

    .message-input input {
      flex: 1;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 5px;
      margin-right: 10px;
    }

    .message-input button {
      padding: 10px;
      border: none;
      background-color: #3498db;
      color: #fff;
      border-radius: 5px;
      cursor: pointer;
    }

    .user-form {
      max-width: 400px;
      padding: 40px;
      box-sizing: border-box;
      background-color: #fff;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
      border-radius: 8px;
    }

    .user-form h2 {
      font-size: 1.5rem;
      margin-bottom: 20px;
      text-align: center;
    }

    .user-form label {
      display: block;
      margin-bottom: 8px;
    }

    .user-form input {
      width: 100%;
      padding: 10px 0;
      border: 1px solid #ccc;
      border-radius: 5px;
      margin-bottom: 20px;
    }

    .user-form button {
      padding: 12px;
      border: none;
      background-color: #3498db;
      color: #fff;
      border-radius: 5px;
      cursor: pointer;
      width: 100%;
    }

    .hidden {
      display: none;
    }

    a.logout {
      color: #fff;
      text-decoration: none;
    }

    #adsList {
      width: 200px;
      border: 1px solid #ccc;
      float: left;
      margin-right: 10px;
      height: 300px;
      overflow-y: scroll;
    }

    #messages {
      width: calc(100% - 220px);
      height: 300px;
      border: 1px solid #ccc;
      overflow-y: scroll;
      margin-bottom: 10px;
    }

    #messages div, #adsList div {
      padding: 5px;
      border-bottom: 1px solid #eee;
      cursor: pointer;
    }
  </style>
</head>
<body>

<h2>Chat Application</h2>

<div class="chat-container">

  <div class="users-list">
    <h2>Chat Rooms</h2>
    <div class="users-list-container" id="chatRoomsList">Loading chat rooms...</div>
    <h2>Ads List</h2>
    <div class="users-list-container" id="adsList">Loading ads...</div>
  </div>
  <div class="chat-area">
    <div id="messages">Select an ad to chat</div>
    <div class="message-input">
      <input type="text" id="content" placeholder="Type a message..." />
      <button onclick="sendMessage()">Send</button>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/sockjs-client/1.5.0/sockjs.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>
<script>
  let stompClient = null;
  const userId = 1; // Replace with the sender's user ID
  let currentAdId = null;
  let currentRecipientId = null;

  // Connect to WebSocket and initialize chat
  function connect() {
    const socket = new SockJS('/api/ws');
    stompClient = Stomp.over(socket);

    stompClient.connect({}, (frame) => {
      console.log('Connected: ' + frame);
      // Subscribe to the user's message queue
      stompClient.subscribe(`/user/${userId}/queue/messages`, (message) => {
        const chatNotification = JSON.parse(message.body);
        displayMessage(chatNotification);
      });
      loadChatRooms();
      loadAds();
    });
  }
  async function loadChatRooms() {
    const response = await fetch(`/api/api/chatrooms/${userId}`);
    const chatRooms = await response.json();
    const chatRoomsListContainer = document.getElementById("chatRoomsList");
    chatRoomsListContainer.innerHTML = ""; // Clear existing chat rooms
    chatRooms.forEach(chatRoom => {
      console.log(chatRoom);
      if (chatRoom.recipientId != userId) {
        const chatRoomDiv = document.createElement("div");
        chatRoomDiv.textContent = `Chat with ${chatRoom.recipientId}`;
        chatRoomDiv.onclick = () => loadMessages(chatRoom.adId, chatRoom.recipientId);
        chatRoomsListContainer.appendChild(chatRoomDiv);
      }
    });
  }

  // Load all available ads
  async function loadAds() {
    const response = await fetch('/api/ads/all');
    const ads = await response.json();
    const adsListContainer = document.getElementById("adsList");
    adsListContainer.innerHTML = ""; // Clear existing ads
    ads.forEach(ad => {
      const adDiv = document.createElement("div");
      console.log(ad);
      adDiv.textContent = ad.title;
      adDiv.onclick = () => loadMessages(ad.adId, ad.user.id);
      adsListContainer.appendChild(adDiv);
    });
  }

  // Load messages for the selected ad
  async function loadMessages(adId, recipientId) {
    currentAdId = adId;
    currentRecipientId = recipientId;

    const response = await fetch(`/api/messages/${adId}/${userId}/${recipientId}`);
    const messages = await response.json();

    const messagesContainer = document.getElementById("messages");
    messagesContainer.innerHTML = ""; // Clear existing messages
    messages.forEach(message => {
      displayMessage(message);
    });
  }

  // Display a single message in the chat view
  function displayMessage(message) {
    const messagesContainer = document.getElementById("messages");
    const messageDiv = document.createElement("div");
    messageDiv.textContent = message.content;
    messageDiv.className = message.senderId === userId ? "sender" : "receiver";
    messagesContainer.appendChild(messageDiv);
    messagesContainer.scrollTop = messagesContainer.scrollHeight; // Scroll to the latest message
  }

  // Send a message to the selected recipient
  function sendMessage() {
    const content = document.getElementById("content").value;
    if (!content.trim()) {
      return;
    }
    const message = {
      content,
      adId: currentAdId,
      senderId: userId,
      recipientId: currentRecipientId,
    };
    console.log("Sending message:", message); // Log the message to check the payload

    stompClient.send(`/app/chat`, {}, JSON.stringify(message));
    document.getElementById("content").value = ""; // Clear input field
  }

  // Initialize WebSocket connection
  connect();
</script>

</body>
</html>
