<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f7f8fc;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }

        .login-container {
            width: 100%;
            max-width: 400px;
            padding: 20px;
            background-color: #fff;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }

        .login-container h2 {
            text-align: center;
            margin-bottom: 20px;
            font-size: 24px;
            color: #333;
        }

        .login-container label {
            display: block;
            font-size: 14px;
            color: #555;
            margin-bottom: 5px;
        }

        .login-container input[type="email"],
        .login-container input[type="password"] {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 14px;
        }

        .login-container button {
            width: 100%;
            padding: 12px;
            background-color: #3498db;
            border: none;
            color: #fff;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        .login-container button:hover {
            background-color: #2980b9;
        }

        .login-container .forgot-password {
            display: block;
            text-align: right;
            margin-top: 10px;
            font-size: 12px;
            color: #3498db;
            text-decoration: none;
        }

        .login-container .forgot-password:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
<div class="login-container">
    <h2>Login</h2>
    <form id="loginForm">
        <label for="email">Email</label>
        <input type="email" id="email" name="username" required>

        <label for="password">Password</label>
        <input type="password" id="password" name="password" required>

        <button type="submit">Login</button>
        <a href="/password/forgot" class="forgot-password">Forgot Password?</a>
    </form>
    <form action="/api/oauth2/authorization/google" method="GET">
        <button type="submit" class="login-with-google-btn">
            Sign in with Google
        </button>
    </form>
    <form action="/api/oauth2/authorization/facebook" method="GET">
        <button type="submit" class="login-with-google-btn">
            Sign in with Facebook
        </button>
    </form>
</div>

<script>
    async function login(username, password) {
        try {
            const response = await fetch('/api/authenticate', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password })
            });

            if (response.ok) {
                const data = await response.json();
                // Store userId and token in local storage
                console.log(data);
                localStorage.setItem('userId', data.userId);
                localStorage.setItem('token', data.token);
                // Redirect user or initialize chat
                initializeChat();
            } else {
                const errorData = await response.json();
                alert(errorData.message || 'Login failed');
            }
        } catch (error) {
            console.error('An error occurred during login:', error);
            alert('A network error occurred. Please try again later.');
        }
    }

    document.getElementById("loginForm").addEventListener("submit", async function(event) {
        event.preventDefault();
        const username = document.getElementById("email").value;
        const password = document.getElementById("password").value;

        await login(username, password);
    });

    function initializeChat() {
        // Replace this with actual chat initialization logic or redirect
        console.log("User logged in, initializing chat...");
    }
</script>
</body>
</html>
