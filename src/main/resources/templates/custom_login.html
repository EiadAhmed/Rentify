<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat Login</title>
</head>
<body>
<!-- Login Form -->
<div id="login-section">
    <h2>Login</h2>
    <form id="login-form">
        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required>
        <label for="password">Password:</label>
        <input type="password" id="password" name="password" required>
        <button type="submit">Login</button>
    </form>
</div>

<!-- Chat Rooms Section (hidden initially) -->
<div id="chat-rooms-section" style="display: none;">
    <h2>Your Chat Rooms</h2>
    <ul id="chat-rooms-list"></ul>
</div>

<script>
    // Login Form Submission
    document.getElementById('login-form').addEventListener('submit', async (event) => {
        event.preventDefault();

        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;

        try {
            // Authenticate user
            const loginResponse = await fetch('http://localhost:8080/api/authenticate', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, password })
            });

            if (!loginResponse.ok) {
                throw new Error('Failed to log in. Please check your credentials.');
            }

            const loginData = await loginResponse.json();
            const userId = loginData.userId; // Assuming the server returns userId in the response

            // Fetch chat rooms with the obtained userId
            const chatRoomsResponse = await fetch(`http://localhost:8080/api/chatrooms/${userId}`, {
                method: 'GET',
                headers: { 'Content-Type': 'application/json' }
            });

            if (!chatRoomsResponse.ok) {
                throw new Error('Failed to fetch chat rooms.');
            }

            const chatRoomsData = await chatRoomsResponse.json();

            // Display chat rooms
            document.getElementById('login-section').style.display = 'none';
            document.getElementById('chat-rooms-section').style.display = 'block';

            const chatRoomsList = document.getElementById('chat-rooms-list');
            chatRoomsList.innerHTML = ''; // Clear previous chat rooms

            chatRoomsData.forEach(chatRoom => {
                const li = document.createElement('li');
                li.textContent = `Chat Room: ${chatRoom.title}`;
                chatRoomsList.appendChild(li);
            });

        } catch (error) {
            console.error(error);
            alert(error.message);
        }
    });
</script>
</body>
</html>
